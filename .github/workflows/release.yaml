name: Release Charts

on:
  push:
    branches:
      - main

concurrency:
  group: helm-chart-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install validation dependencies
        run: python3 -m pip install PyYAML

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Get next version for client-app
        id: client-app-version
        uses: mucsi96/get-next-version@main
        with:
          prefix: client-app
          suffix: '.0.0'
          src: charts/client_app

      - name: Get next version for spring-app
        id: spring-app-version
        uses: mucsi96/get-next-version@main
        with:
          prefix: spring-app
          suffix: '.0.0'
          src: charts/spring_app

      - name: Get next version for go-app
        id: go-app-version
        uses: mucsi96/get-next-version@main
        with:
          prefix: go-app
          suffix: '.0.0'
          src: charts/go_app

      - name: Get next version for rust-app
        id: rust-app-version
        uses: mucsi96/get-next-version@main
        with:
          prefix: rust-app
          suffix: '.0.0'
          src: charts/rust_app

      - name: Get next version for node-app
        id: node-app-version
        uses: mucsi96/get-next-version@main
        with:
          prefix: node-app
          suffix: '.0.0'
          src: charts/node_app

      - name: Get next version for postgres-db
        id: postgres-db-version
        uses: mucsi96/get-next-version@main
        with:
          prefix: postgres-db
          suffix: '.0.0'
          src: charts/postgres_db

      - name: Get next version for redis
        id: redis-version
        uses: mucsi96/get-next-version@main
        with:
          prefix: redis
          suffix: '.0.0'
          src: charts/redis

      - name: Get next version for oauth2-proxy-forwardauth
        id: forwardauth-version
        uses: mucsi96/get-next-version@main
        with:
          prefix: oauth2-proxy-forwardauth
          suffix: '.0.0'
          src: charts/oauth2_proxy_forwardauth

      - name: Update chart versions
        run: |
          python3 scripts/set_chart_version.py charts/client_app/Chart.yaml "${{ steps.client-app-version.outputs.version }}" "${{ steps.client-app-version.outputs.tag }}"
          python3 scripts/set_chart_version.py charts/spring_app/Chart.yaml "${{ steps.spring-app-version.outputs.version }}" "${{ steps.spring-app-version.outputs.tag }}"
          python3 scripts/set_chart_version.py charts/go_app/Chart.yaml "${{ steps.go-app-version.outputs.version }}" "${{ steps.go-app-version.outputs.tag }}"
          python3 scripts/set_chart_version.py charts/rust_app/Chart.yaml "${{ steps.rust-app-version.outputs.version }}" "${{ steps.rust-app-version.outputs.tag }}"
          python3 scripts/set_chart_version.py charts/node_app/Chart.yaml "${{ steps.node-app-version.outputs.version }}" "${{ steps.node-app-version.outputs.tag }}"
          python3 scripts/set_chart_version.py charts/postgres_db/Chart.yaml "${{ steps.postgres-db-version.outputs.version }}" "${{ steps.postgres-db-version.outputs.tag }}"
          python3 scripts/set_chart_version.py charts/redis/Chart.yaml "${{ steps.redis-version.outputs.version }}" "${{ steps.redis-version.outputs.tag }}"
          python3 scripts/set_chart_version.py charts/oauth2_proxy_forwardauth/Chart.yaml "${{ steps.forwardauth-version.outputs.version }}" "${{ steps.forwardauth-version.outputs.tag }}"

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Build dependencies and validate application charts
        run: |
          helm repo add oauth2-proxy https://oauth2-proxy.github.io/manifests
          helm dependency build charts/oauth2_proxy_forwardauth
          python3 scripts/check_chart_versions.py
          python3 scripts/check_forwardauth.py
          python3 scripts/check_forwardauth_login.py
          python3 scripts/check_rust_app.py

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

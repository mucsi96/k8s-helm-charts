name: Validate Charts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install validation dependencies
        run: |
          python3 -m pip install PyYAML
          helm repo add oauth2-proxy https://oauth2-proxy.github.io/manifests
          helm dependency build charts/oauth2_proxy_forwardauth
          python3 scripts/build_app_dependencies.py
      - name: Validate shared application library and packaging
        run: python3 scripts/check_app_common.py --base-ref "${{ github.event.pull_request.base.sha }}"
      - name: Resolve chart version with the released shared action
        id: published-version
        uses: mucsi96/get-next-version@main
        with:
          prefix: oauth2-proxy-forwardauth
          suffix: '.0.0'
          src: charts/oauth2_proxy_forwardauth
      - name: Verify released action outputs update Helm metadata
        env:
          COUNTER: ${{ steps.published-version.outputs.version }}
          TAG: ${{ steps.published-version.outputs.tag }}
        run: python3 scripts/set_chart_version.py charts/oauth2_proxy_forwardauth/Chart.yaml "$COUNTER" "$TAG"
      - name: Validate Rust runtime and standard routing contracts
        run: |
          python3 scripts/check_chart_versions.py
          helm lint charts/rust_app --set image=example/rust-app:1 --set host=rust.example.com
          helm lint charts/static_client_app --set host=static.example.com --set staticOrigin=example.z1.web.core.windows.net
          python3 scripts/check_rust_app.py
          python3 scripts/check_forwardauth.py
          python3 scripts/check_forwardauth_login.py
          python3 scripts/check_spa_frontend.py
          python3 scripts/check_static_frontend.py
          bash -n scripts/render_go_app.sh scripts/render_rust_app.sh

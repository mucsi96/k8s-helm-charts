apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    kubernetes.io/enforce-mountable-secrets: "true"
    azure.workload.identity/client-id: {{ required "clientId value is required!" .Values.clientId | quote }}
  name: {{ required "serviceAccountName value is required!" .Values.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
secrets:
  - name: {{ .Release.Name }}-config-files
  - name: {{ .Release.Name }}-env

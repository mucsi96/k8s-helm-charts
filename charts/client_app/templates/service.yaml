apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  {{- if .Values.staticOrigin }}
  type: ExternalName
  externalName: {{ .Values.staticOrigin | quote }}
  ports:
    - port: 443
      protocol: TCP
      name: https
  {{- else }}
  ports:
    - port: {{ required "appPort value is required!" .Values.appPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Release.Name }}
  {{- end }}

global:
  forwardAuth:
    host: ""
    issuerURL: ""
    credentialsSecret: ""
    mode: api-token
    apiScope: ""
    cookieName: ""
    cookieRefresh: 5m
    cookieExpire: 168h
    trustedProxyCIDRs: []
gateway:
  name: traefik
  namespace: traefik
  sectionName: websecure
excludedRoutes: []
bootstrapRoutes: []
bootstrapAdapter:
  image: docker.io/library/python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi
oauth2-proxy:
  config:
    existingSecret: '{{ .Values.global.forwardAuth.credentialsSecret }}'
    configFile: '{{ include "forwardauth.legacyConfig" . }}'
  alphaConfig:
    enabled: true
    configFile: '{{ include "forwardauth.alphaConfig" . }}'
  ingress:
    enabled: false
  gatewayApi:
    enabled: false
  serviceAccount:
    automountServiceAccountToken: false
  metrics:
    enabled: false
  sessionStorage:
    type: redis
    redis:
      existingSecret: ""
      passwordKey: redis-password
      standalone:
        connectionUrl: ""
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi

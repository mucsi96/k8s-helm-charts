{{- if .Values.machineRoutes }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-machine
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.global.forwardAuth.host | quote }}
  rules:
    {{- range .Values.machineRoutes }}
    - matches:
        - path:
            type: Exact
            value: {{ .path | quote }}
          method: {{ .method }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ $.Release.Name }}-no-store
      backendRefs:
        - name: {{ .service | quote }}
          port: {{ .port }}
    {{- end }}
{{- end }}

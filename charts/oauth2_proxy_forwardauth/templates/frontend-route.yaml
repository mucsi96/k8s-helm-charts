{{- if .Values.frontend }}
{{- if .Values.frontend.runtimeConfig }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-index-config
  namespace: {{ .Release.Namespace }}
spec:
  plugin:
    rewritebody:
      rewrites:
        - regex: "[\"']__APP_CONFIG_JSON__[\"']"
          replacement: {{ .Values.frontend.runtimeConfig | toJson | replace "$" "$$" | quote }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-frontend
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.global.forwardAuth.host | quote }}
  rules:
    - matches:
      {{- range $method := list "GET" "HEAD" }}
      {{- range $path := list "/" "/index.html" }}
        - path:
            type: Exact
            value: {{ $path | quote }}
          method: {{ $method }}
      {{- end }}
        - path:
            type: PathPrefix
            value: /
          method: {{ $method }}
          headers:
            - name: Sec-Fetch-Dest
              type: Exact
              value: document
        - path:
            type: PathPrefix
            value: /
          method: {{ $method }}
          headers:
            - name: Accept
              type: RegularExpression
              value: '(?i)(^|[ ,])text/html([ ;,]|$)'
      {{- end }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: private, no-cache, no-store
            remove: [Authorization, X-Auth-Request-Access-Token, ETag, Last-Modified]
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ .Release.Name }}-document
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Authorization, Cookie, X-XSRF-TOKEN, X-Auth-Request-Email, X-Auth-Request-Access-Token, X-Auth-Request-User, X-Forwarded-User, X-Forwarded-Email, If-None-Match, If-Modified-Since, Range, If-Range]
            set:
              - name: Accept-Encoding
                value: identity
      {{- if .Values.frontend.runtimeConfig }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ .Release.Name }}-index-config
      {{- end }}
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /index.html
      backendRefs:
        - name: {{ .Values.frontend.service }}
          port: {{ .Values.frontend.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Authorization, Cookie, X-XSRF-TOKEN, X-Auth-Request-Email, X-Auth-Request-Access-Token, X-Auth-Request-User, X-Forwarded-User, X-Forwarded-Email]
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            remove: [Authorization, X-Auth-Request-Access-Token]
      backendRefs:
        - name: {{ .Values.frontend.service }}
          port: {{ .Values.frontend.port }}
{{- end }}

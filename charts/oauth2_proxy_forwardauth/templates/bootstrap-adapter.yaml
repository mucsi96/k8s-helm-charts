{{- if .Values.bootstrapRoutes }}
{{- $config := include "forwardauth.bootstrapConfig" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-bootstrap-config
  namespace: {{ .Release.Namespace }}
data:
  config.json: {{ $config | quote }}
  bootstrap_adapter.py: |
{{ .Files.Get "files/bootstrap_adapter.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-bootstrap
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bootstrap-adapter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootstrap-adapter
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ $config | sha256sum }}
        checksum/adapter: {{ .Files.Get "files/bootstrap_adapter.py" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: bootstrap-adapter
          image: {{ .Values.bootstrapAdapter.image | quote }}
          command: [python3, -B, -u, /app/bootstrap_adapter.py, --config, /app/config.json]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /_bootstrap/health
              port: http
          livenessProbe:
            httpGet:
              path: /_bootstrap/health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
{{ toYaml .Values.bootstrapAdapter.resources | indent 12 }}
          volumeMounts:
            - name: bootstrap-config
              mountPath: /app
              readOnly: true
      volumes:
        - name: bootstrap-config
          configMap:
            name: {{ .Release.Name }}-bootstrap-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-bootstrap
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bootstrap-adapter
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-bootstrap
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.global.forwardAuth.host | quote }}
  rules:
    - matches:
      {{- range .Values.bootstrapRoutes }}
        - path:
            type: Exact
            value: {{ .path | quote }}
          method: GET
      {{- end }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: no-store
            remove: [Authorization, X-Auth-Request-Access-Token]
      backendRefs:
        - name: {{ .Release.Name }}-bootstrap
          port: 80
{{- end }}

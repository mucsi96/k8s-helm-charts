{{- if .Values.excludeFromForwardAuth }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-excluded-routes
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.global.forwardAuth.host | quote }}
  rules:
    {{- range .Values.excludeFromForwardAuth }}
    - matches:
        - path:
            type: Exact
            value: {{ .path | quote }}
          method: {{ .method }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: no-store
            remove: [Authorization, X-Auth-Request-Access-Token]
      backendRefs:
        - name: {{ .service | quote }}
          port: {{ .port }}
    {{- end }}
{{- end }}

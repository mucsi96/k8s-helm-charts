{{- if .Values.serviceAccount.create -}}
{{- $annotations := deepCopy .Values.serviceAccount.annotations -}}
{{- if .Values.clientId -}}
{{- $_ := set $annotations "azure.workload.identity/client-id" .Values.clientId -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rust-app.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}

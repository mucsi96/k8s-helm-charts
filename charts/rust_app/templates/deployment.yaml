{{- $annotations := deepCopy .Values.podAnnotations -}}
{{- if .Values.env -}}
{{- $_ := set $annotations "checksum/secret_env" (include (print $.Template.BasePath "/secret_env.yaml") . | sha256sum) -}}
{{- end -}}
{{- if .Values.configFile -}}
{{- $_ := set $annotations "checksum/secret_config_files" (include (print $.Template.BasePath "/secret_config_files.yaml") . | sha256sum) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- if .Values.clientId }}
        azure.workload.identity/use: "true"
        {{- end }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "rust-app.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.image | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.appPort }}
          {{- if or .Values.env .Values.envFrom }}
          envFrom:
            {{- if .Values.env }}
            - secretRef:
                name: {{ .Release.Name }}-env
            {{- end }}
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          env:
            - name: LISTEN_ADDR
              value: {{ printf "0.0.0.0:%v" .Values.appPort | quote }}
            - name: BASE_PATH
              value: {{ .Values.basePath | quote }}
            - name: K8S_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          livenessProbe:
            httpGet:
              path: {{ .Values.health.livenessPath }}
              port: http
          readinessProbe:
            httpGet:
              path: {{ .Values.health.readinessPath }}
              port: http
          startupProbe:
            httpGet:
              path: {{ .Values.health.readinessPath }}
              port: http
            periodSeconds: 2
            failureThreshold: 30
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.configFile .Values.persistentVolumeClaims .Values.extraVolumeMounts }}
          volumeMounts:
            {{- range .Values.configFile }}
            - name: secret-config-files
              mountPath: {{ .mountPath | quote }}
              subPath: {{ .name | quote }}
              readOnly: true
            {{- end }}
            {{- range .Values.persistentVolumeClaims }}
            - name: pvc-{{ .name }}
              mountPath: {{ .mountPath | quote }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.configFile .Values.persistentVolumeClaims .Values.extraVolumes }}
      volumes:
        {{- if .Values.configFile }}
        - name: secret-config-files
          secret:
            secretName: {{ .Release.Name }}-config-files
        {{- end }}
        {{- range .Values.persistentVolumeClaims }}
        - name: pvc-{{ .name }}
          persistentVolumeClaim:
            claimName: {{ .name }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}

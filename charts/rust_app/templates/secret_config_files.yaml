{{- if .Values.configFile }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-config-files
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
  {{- range .Values.configFile }}
  {{ .name | quote }}: {{ .data | b64dec | quote }}
  {{- end }}
{{- end }}

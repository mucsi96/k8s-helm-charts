apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-route
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: websecure
  hostnames:
    - {{ required "host value is required!" .Values.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.basePath | default "/" | quote }}
      {{- if ne .Values.auth nil }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set: [{name: Cache-Control, value: no-store}]
            remove: [Authorization, X-Auth-Request-Access-Token]
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Authorization, X-Auth-Request-Email, X-Auth-Request-Access-Token, X-Auth-Request-User, X-Forwarded-User, X-Forwarded-Email]
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ .Release.Name }}-auth
      {{- else if .Values.routeFilters }}
      filters:
        {{- toYaml .Values.routeFilters | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ .Release.Name }}
          port: {{ required "appPort value is required!" .Values.appPort }}
